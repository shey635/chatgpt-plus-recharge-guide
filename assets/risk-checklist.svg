<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Plus下单前风险检查</title><desc id="desc">检查账号归属、最终费用、续费规则、售后边界和敏感信息</desc>
  <rect width="1200" height="520" rx="24" fill="#f6f8fa"/>
  <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f" font-family="Arial, PingFang SC, sans-serif">下单前风险检查清单</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <g transform="translate(90 115)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#dafbe1"/><path d="M29 36l7 7 13-16" fill="none" stroke="#1a7f37" stroke-width="4"/><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">账号归属</text><text x="72" y="55" font-size="16" fill="#57606a">本人账号、协助充值还是独立账号？</text></g>
    <g transform="translate(630 115)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#dafbe1"/><path d="M29 36l7 7 13-16" fill="none" stroke="#1a7f37" stroke-width="4"/><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">最终费用</text><text x="72" y="55" font-size="16" fill="#57606a">币种、税费、汇率和服务费是否清楚？</text></g>
    <g transform="translate(90 215)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#dafbe1"/><path d="M29 36l7 7 13-16" fill="none" stroke="#1a7f37" stroke-width="4"/><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">周期与续费</text><text x="72" y="55" font-size="16" fill="#57606a">何时到期、是否自动续费、怎样取消？</text></g>
    <g transform="translate(630 215)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#dafbe1"/><path d="M29 36l7 7 13-16" fill="none" stroke="#1a7f37" stroke-width="4"/><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">售后与退款</text><text x="72" y="55" font-size="16" fill="#57606a">哪些异常可处理？以实时规则为准</text></g>
    <g transform="translate(90 315)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#ffebe9"/><text x="38" y="43" text-anchor="middle" font-size="23" font-weight="700" fill="#cf222e">!</text><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">敏感信息</text><text x="72" y="55" font-size="16" fill="#57606a">不提供验证码、Token、Cookie和付款资料</text></g>
    <g transform="translate(630 315)"><rect width="480" height="72" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="38" cy="36" r="17" fill="#fff8c5"/><text x="38" y="43" text-anchor="middle" font-size="23" font-weight="700" fill="#9a6700">存</text><text x="72" y="31" font-size="20" font-weight="700" fill="#24292f">订单留痕</text><text x="72" y="55" font-size="16" fill="#57606a">保存订单、条款和必要沟通记录</text></g>
  </g>
  <text x="600" y="458" text-anchor="middle" font-size="20" font-weight="700" fill="#cf222e" font-family="Arial, PingFang SC, sans-serif">不要相信绝对安全、永久稳定或保证成功</text>
  <text x="600" y="488" text-anchor="middle" font-size="16" fill="#57606a" font-family="Arial, PingFang SC, sans-serif">第三方服务并非OpenAI官方网站</text>
</svg>
